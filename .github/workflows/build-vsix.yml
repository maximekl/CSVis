name: Build macOS ARM64 VSIX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CSVIS_VSCODE_VERSION: '1.137.0'

jobs:
  build:
    name: Build darwin-arm64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check runner and native binding
        run: node scripts/check-ci-platform.mjs darwin-arm64

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package platform VSIX
        run: npm run package

      - name: Verify installed VSIX
        run: npm run verify:package

      - name: Upload platform VSIX
        uses: actions/upload-artifact@v7
        with:
          name: csvis-darwin-arm64
          path: dist/*-darwin-arm64.vsix
          if-no-files-found: error
